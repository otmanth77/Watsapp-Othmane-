name: Build WhatsApp Othman V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Prepare app files
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp firebase-auth.js www/
          cp manifest.json sw.js logo.png hacker.jpg icon-192.png icon-512.png www/
          if [ -f registration-background.png ]; then
            cp registration-background.png www/
          fi

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/othman-v2-release.jks
          test -s android/app/othman-v2-release.jks
          {
            echo "storeFile=othman-v2-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=othman-v2"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/app/keystore.properties

      - name: Build signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk WhatsApp-Othman-V2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Othman-V2.1-Release
          path: WhatsApp-Othman-V2.1.apk
          if-no-files-found: error
          retention-days: 30

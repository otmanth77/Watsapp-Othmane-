name: Build WhatsApp Othman V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Prepare app files
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp firebase-auth.js www/
          cp manifest.json sw.js logo.png hacker.jpg icon-192.png icon-512.png www/
          if [ -f registration-background.png ]; then
            cp registration-background.png www/
          fi

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WhatsApp-Othman-V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Othman-V2
          path: WhatsApp-Othman-V2.apk
          if-no-files-found: error
          retention-days: 30
